repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: python
        additional_dependencies: [ruff==0.15.7]
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff formatting check
        entry: python -m ruff format --check
        language: python
        additional_dependencies: [ruff==0.15.7]
        types: [python]
        stages: [pre-commit]
      - id: repository-hygiene
        name: YAML and conflict markers
        entry: python scripts/check_hygiene.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: Offline unit tests
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
