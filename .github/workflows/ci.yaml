name: Streamer Recommender CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile streamer_recommender.py app.py

      - name: Run recommender smoke test
        env:
          DATA_PATH: anchors_100.csv
        run: |
          python - <<'PY'
          from streamer_recommender import HybridStreamerRecommender

          recommender = HybridStreamerRecommender(
              "anchors_100.csv"
          )

          results = recommender.retrieve(
              "想看會唱歌、互動熱絡的主播",
              top_k=3,
              required_tags=["歌唱", "互動熱絡"],
          )

          assert len(results) == 3

          for result in results:
              assert "歌唱" in result["metadata"]["才藝"]
              assert "互動熱絡" in result["metadata"]["風格"]

          print("Recommendation smoke test passed.")
          PY

      - name: Start Streamlit and run health check
        env:
          DATA_PATH: anchors_100.csv
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 &

          SERVER_PID=$!

          for i in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done

          kill $SERVER_PID
          echo "Streamlit health check failed"
          exit 1